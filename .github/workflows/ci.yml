name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Scoped to tsviewer: packages/core has pre-existing type errors that are
      # outside this cleanup. Widen to `pnpm -r type-check` when core is fixed.
      - run: pnpm --filter @pennsieve-viz/tsviewer type-check
      - run: pnpm build
      # Runs the suite and fails if coverage drops below the floors in
      # packages/ts-viewer/vitest.config.ts.
      - run: pnpm --filter @pennsieve-viz/tsviewer test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: tsviewer-coverage
          path: packages/ts-viewer/coverage
      - name: tsviewer dist stays small and typed
        run: |
          cd packages/ts-viewer
          test -f dist/index.d.ts

          # Bytes, not `du` blocks: dist holds one small declaration per source
          # file, so block rounding reported nearly 50 percent more than the
          # content actually weighs.
          bytes() { find dist -type f "$@" -exec cat {} + | wc -c; }

          # What a browser downloads. This is the gate that matters: it catches a
          # dependency slipping back into the bundle, which is what put dist at
          # 4.4 MB before the externals were fixed.
          PAYLOAD=$(bytes \( -name '*.js' -o -name '*.cjs' -o -name '*.css' \))
          echo "tsviewer runtime payload: $((PAYLOAD / 1024)) KB"
          test "$PAYLOAD" -lt 614400

          # Declarations ship too, and grow with the API surface rather than with
          # what is bundled, so they get their own looser ceiling.
          TOTAL=$(bytes)
          echo "tsviewer dist total: $((TOTAL / 1024)) KB"
          test "$TOTAL" -lt 1572864
      - uses: actions/upload-artifact@v4
        with:
          name: tsviewer-dist
          path: packages/ts-viewer/dist

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # Installs the packed tarball outside the workspace and imports it. Workspace
  # hoisting cannot mask a missing or misdeclared dependency here; this is the
  # failure mode that forced the revert of PR #70.
  pack-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pennsieve-viz/tsviewer build
      # pnpm pack is not filter-aware; run it from the package directory.
      - run: pnpm pack --pack-destination "$RUNNER_TEMP"
        working-directory: packages/ts-viewer
      - name: install tarball in isolation and import it
        run: |
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/pennsieve-viz-tsviewer-*.tgz vue pinia element-plus
          test -f node_modules/@pennsieve-viz/tsviewer/dist/style.css
          test -f node_modules/@pennsieve-viz/tsviewer/dist/index.d.ts
          node -e "import('@pennsieve-viz/tsviewer').then(m => { if (!m.TSViewer || !m.createViewerStore) { console.error('missing exports'); process.exit(1) } console.log('smoke ok') })"
