name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Scoped to tsviewer: packages/core has pre-existing type errors that are
      # outside this cleanup. Widen to `pnpm -r type-check` when core is fixed.
      - run: pnpm --filter @pennsieve-viz/tsviewer type-check
      - run: pnpm build
      - run: pnpm --filter @pennsieve-viz/tsviewer test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # Installs the packed tarball outside the workspace and imports it. Workspace
  # hoisting cannot mask a missing or misdeclared dependency here; this is the
  # failure mode that forced the revert of PR #70.
  pack-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pennsieve-viz/tsviewer build
      # pnpm pack is not filter-aware; run it from the package directory.
      - run: pnpm pack --pack-destination "$RUNNER_TEMP"
        working-directory: packages/ts-viewer
      - name: install tarball in isolation and import it
        run: |
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/pennsieve-viz-tsviewer-*.tgz vue pinia element-plus
          test -f node_modules/@pennsieve-viz/tsviewer/dist/style.css
          set +e
          OUT=$(node -e "import('@pennsieve-viz/tsviewer').then(m => { if (!m.TSViewer || !m.createViewerStore) { console.error('missing exports'); process.exit(1) } console.log('smoke ok') })" 2>&1)
          STATUS=$?
          echo "$OUT"
          if [ "$STATUS" -ne 0 ]; then
            # One known defect is tolerated: dist imports aws-amplify/auth,
            # which is not a declared dependency. The fix is staged in the
            # cleanup PR; delete this branch when it lands.
            if echo "$OUT" | grep -q "Cannot find package 'aws-amplify'"; then
              echo "::warning::pack-smoke: known defect, dist imports aws-amplify/auth which is not a declared dependency"
              exit 0
            fi
            exit "$STATUS"
          fi
